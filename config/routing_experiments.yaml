profile_id: thin-client-routing-shadow-pass-through-v1
mode: shadow_candidate_pass_through
enabled: true
kill_switch: false
thin_client_routing: true
sample_rate: 0.10
daily_budget_usd: 10.0
min_text_chars: 0
max_text_chars: 8000
providers:
  - anthropic
  - openai
source_surfaces:
  - anthropic_messages
  - openai_responses
  - openai_chat
  - codex_turn
streaming_shadow_source_surfaces:
  - anthropic_messages

# Thin-client routing policy. The managed server owns pathway discovery and can
# mint review/observe-only pathways from metadata. The local client keeps only
# hard guardrails, explicit preferences, and a deterministic offline fallback.
blocklist: []
preferred_pathways:
  - requested_model: claude-sonnet-4-6
    routed_model: claude-haiku-4-5-20251001
    provider: anthropic
    source_surface: anthropic_messages
    app_family: claude_code
    category: tool-result
    stream: true
    max_text_chars: 128000
fallback_routes:
  - requested_model: claude-opus-4-8
    routed_model: claude-sonnet-4-6
  - requested_model: claude-opus-4-5
    routed_model: claude-sonnet-4-6
  - requested_model: claude-sonnet-4-6
    routed_model: claude-haiku-4-5-20251001
  - requested_model: gpt-5.5
    routed_model: gpt-5.4
  - requested_model: gpt-5.4
    routed_model: gpt-5.3
  - requested_model: gpt-5.3-codex
    routed_model: gpt-5-codex
  - requested_model: gpt-5-codex
    routed_model: gpt-5-mini
  - requested_model: gpt-5.3
    routed_model: gpt-5-mini
  - requested_model: gpt-5-mini
    routed_model: gpt-5-nano

workflow_phases: []
categories:
  - chat
  - short-completion
  - tool-light
  - tool-result
  - tool-heavy
  - codex-turn
eligibility_overrides:
  - scope: category
    provider: anthropic
    source_surface: anthropic_messages
    category: chat
    max_text_chars: 32000
  - scope: category
    provider: anthropic
    source_surface: anthropic_messages
    category: tool-light
    max_text_chars: 64000
  - scope: category
    provider: anthropic
    source_surface: anthropic_messages
    category: tool-result
    stream: true
    max_text_chars: 128000
    sample_rate: 0.10
    daily_budget_usd: 10.0
similarity_threshold: 0.86
min_samples_for_confidence: 20
store_response_bodies: false
