# AgentFlow default A/B routing experiment policy.
# Copy to ~/.agentflow/routing_experiments.yaml (or set AGENTFLOW_ROUTING_EXPERIMENTS)
# to sample routing experiments. The default mode compares already-applied routed-down
# calls against the originally requested model. Use mode: shadow_candidate_pass_through
# to keep the user-visible call on the requested model and send only a shadow request
# to the configured cheaper candidate.
#
# This is disabled by default because it sends an additional shadow request upstream.
# Response bodies are not stored unless store_response_bodies is explicitly enabled.

profile_id: first-safe-openai-codex-ab-v1
mode: applied_routed_down
enabled: false
kill_switch: false
sample_rate: 0.0
daily_budget_usd: 0.0
min_text_chars: 0
max_text_chars: 8000
providers:
  - openai
source_surfaces:
  - openai_responses
  - openai_chat
  - codex_turn
model_pairs:
  - requested_model: gpt-5-codex
    routed_model: gpt-5-mini
  - requested_model: gpt-5.4
    routed_model: gpt-5.4-mini
workflow_phases: []
categories:
  - chat
  - short-completion
similarity_threshold: 0.86
min_samples_for_confidence: 20
store_response_bodies: false
