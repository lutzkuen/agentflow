enabled: true
threshold_chars: 24000
prompt_cache:
  enabled: true
  min_chars: 4096
enhanced_crunch_provider:
  # Local-only provider gate for model-assisted crunching. Managed optimizer
  # responses may recommend profiles, model families, thresholds, canary
  # fractions, and safety-stop thresholds, but source text and generated
  # summaries stay in this local AgentFlow process or a customer-controlled
  # sidecar/endpoint. Endpoint URLs are never included in metadata feedback.
  #
  # Supported modes:
  # - disabled
  # - local_provider_account
  # - customer_sidecar
  # - customer_controlled_endpoint
  mode: disabled
  profile: default
  model: null
  model_family: null
  endpoint_url: null
  max_summary_cost_usd: null
old_context_summarization:
  # Opt-in only. When enabled, AgentFlow may make one additional Anthropic
  # request to the model below to summarize old non-tool conversation turns.
  # The summary is inserted as tagged top-level system context, not as a
  # synthetic user turn, and the original recent turns plus all tool protocol
  # messages are preserved. Summary creation cost, cache reuse, and estimated
  # savings are recorded in crunch_json.old_context_summarization and dashboard
  # stats. The summary cache is used when available but exact request caching is
  # not required for eligibility.
  enabled: false
  rule_id: local-old-context-summarization
  model: claude-haiku-4-5-20251001
  placement: system
  min_request_chars: 32000
  min_summarized_chars: 12000
  max_turns: 6
  keep_recent_turns: 4
  max_summary_chars: 4000
  max_source_chars: 80000
  max_summary_cost_usd: 0.02
  excluded_categories:
    - tool-heavy
    - tool-result
  block_tool_protocol: true
  block_thinking: true
  canary:
    enabled: false
    fraction: 1.0
    salt: ""
    unit: source_hash
  safety_stop:
    enabled: true
    min_outcome_samples: 5
    window: 500
    max_error_rate: 0.1
    max_retry_rate: 0.25
    max_negative_net_savings_rate: 0.5
    max_summary_failure_rate: 0.1
    max_error_rate_delta: 0.05
openai_old_context_summarization:
  # Opt-in only. When enabled, AgentFlow may make one additional local OpenAI
  # provider request to summarize older non-tool Responses/Chat context before
  # forwarding the user's request. Applied and holdout cohorts are selected
  # deterministically; summary text stays out of logged metadata.
  enabled: false
  rule_id: local-openai-old-context-summary
  summary_provider: openai
  summary_model: gpt-5-mini
  min_request_chars: 32000
  min_source_chars: 8000
  max_source_chars: 80000
  keep_recent_items: 4
  max_summary_chars: 4000
  summary_compression_ratio: 0.125
  max_summary_cost_usd: 0.02
  supported_endpoints:
    - responses
    - chat_completions
  blocked_categories:
    - tool-heavy
    - tool-result
  block_tool_protocol: true
  block_file_references: true
  canary:
    enabled: true
    canary_fraction: 0.0
    holdout_fraction: 1.0
    salt: ""
thinking_deduplication:
  enabled: true
  min_chars: 2000
  similarity_threshold: 0.95
  skip_latest_assistant: true
terminal_log_boilerplate:
  # Local-only deterministic cleanup for text blocks that look like terminal
  # logs or test output. Repeated prefixes are compacted, while error lines,
  # stack frames, failing assertions, exit codes, and tool protocol blocks are
  # preserved. Metadata records pattern types and counts only, never raw lines.
  enabled: true
  min_lines: 8
  min_repeated_lines: 4
  max_annotations: 12
terminal_output_compaction:
  # Opt-in only. When enabled, AgentFlow can compact older Anthropic
  # tool_result text that looks like repetitive terminal output before
  # forwarding. Recent turns, tool protocol IDs, commands, failures, stack
  # traces, exit status, and file-change evidence are preserved. Default
  # traffic is holdout-only when an operator enables canary metadata without
  # raising canary_fraction.
  enabled: false
  rule_id: local-terminal-output-compaction-canary
  candidate_id: null
  keep_recent_turns: 2
  min_block_chars: 2000
  head_lines: 12
  tail_lines: 16
  max_evidence_lines: 80
  min_saved_chars: 500
  block_thinking: true
  canary:
    enabled: true
    canary_fraction: 0.0
    holdout_fraction: 1.0
    canary_salt: ""
    canary_unit: request_fingerprint
  safety_stop:
    enabled: true
    min_outcome_samples: 5
    window: 500
    max_error_rate: 0.1
    max_retry_rate: 0.25
    max_negative_savings_rate: 0.25
    max_error_rate_delta: 0.05
  rules: []
