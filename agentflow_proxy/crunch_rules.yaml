repeated_provider_scaffolding:
  # Provider-message profile for reviewed repeated scaffolding candidates.
  # Disabled by default. When a local/manual or managed-recommended rule with
  # reviewed pattern hashes is present, AgentFlow may replace older repeated
  # provider-message sections with bounded notices. System/developer messages,
  # tool_use/tool_result protocol payloads, thinking/reasoning blocks, and the
  # newest task tail are preserved by default.
  enabled: false
  min_request_chars: 12000
  min_section_chars: 700
  keep_recent_messages: 2
  keep_recent_matches: 1
  max_replacements: 16
  block_tool_protocol: true
  block_thinking: true
  rules: []
