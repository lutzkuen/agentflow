# AgentFlow default routing rules.
# Copy to ~/.agentflow/routing_rules.yaml (or set AGENTFLOW_ROUTING_RULES) to customize.
#
# Rules are evaluated top-to-bottom; first match wins.
# All conditions in a rule must match. Omitted conditions always match.
#
# Conditions:
#   model_pattern   — case-insensitive substring match against the requested model name
#   text_chars_lt   — total request text characters less than this value
#   text_chars_gt   — total request text characters greater than this value
#   text_chars_lte  — total request text characters less than or equal to this value
#   text_chars_gte  — total request text characters greater than or equal to this value
#   max_text_chars  — alias for text_chars_lte
#   min_text_chars  — alias for text_chars_gte
#   max_input_tokens_est — estimated input tokens less than or equal to this value
#   min_input_tokens_est — estimated input tokens greater than or equal to this value
#   has_tools       — true/false: whether the request includes tool definitions or tool blocks
#   max_tokens_lte  — max_tokens field is <= this value
#   env_flag        — environment variable that must be truthy for the rule to match
#   provider        — exact match: anthropic | openai
#   source_surface  — exact match against sanitized local source surface metadata
#   endpoint        — exact match against sanitized local endpoint metadata
#   category        — exact match: tool-result | tool-heavy | tool-light | long-context | short-completion | code-gen | chat
#   category_not_in — category name or list of category names to exclude
#   workflow_phase  — exact match against routing metadata: planning | tool-execution | verification | summary | thinking | chat | unknown
#   session_memory  — optional conservative per-session metadata gate:
#     enabled: true
#     window_size: 8
#     min_call_count: 8
#     dominant_phase: tool-execution
#     dominant_phase_in: [tool-execution, summary]
#     min_dominant_phase_count: 8
#     stable_phase: true
#     blocked_phases: [planning, verification, thinking, unknown]
#     max_error_count: 0
#     max_retry_count: 0
#     max_fallback_count: 0
#     allow_thinking: false
#     model_family_floor: sonnet
#
# Action:
#   route_to  — "haiku", "sonnet", "opus" (resolves to current default model), or a full model ID
#   reason    — logged in routing metadata

# Optional behavior-changing phase canary. Disabled by default. When enabled in a
# local manual policy, eligible Sonnet requests are deterministically assigned to
# applied, holdout, or not-selected cohorts from metadata-only request features.
phase_canary:
  enabled: true
  policy_id: local-phase-sonnet-haiku-canary-v1
  model_pattern: sonnet
  stream: true
  target_model: haiku
  eligible_workflow_phases:
    - tool-execution
  excluded_workflow_phases:
    - planning
    - thinking
    - verification
    - summary
    - unknown
  eligible_categories:
    - tool-result
  excluded_categories:
    - tool-heavy
    - tool-light
    - code-gen
    - long-context
    - chat
    - short-completion
  min_workflow_phase_confidence: high
  min_text_chars: 0
  max_text_chars: 0
  canary_fraction: 0.05
  holdout_fraction: 0.10
  salt: agentflow-phase-routing-canary-v1
  cohort_unit: session
  safety_gates:
    block_thinking_history: true
    block_top_level_thinking: true
    block_unsupported_streaming_shape: true
    block_unsafe_tool_call_context: true
    strip_model_incompatible_params: true
    fallback_to_requested_on_rate_limit: true
    content_free: true
  safety_stop:
    enabled: true
    window_hours: 24
    min_samples: 10
    min_holdout_samples: 5
    max_error_rate: 0.05
    max_retry_rate: 0.20
    max_fallback_rate: 0.20
    max_latency_regression_ratio: 1.50
    limit: 500

# Optional behavior-changing OpenAI routing canary. Disabled by default. When
# enabled in a local manual policy, eligible OpenAI requests are
# deterministically assigned to applied, holdout, or not-selected cohorts from
# metadata-only request features. The target model must stay inside the OpenAI
# provider family.
openai_canary:
  enabled: true
  policy_id: local-openai-routing-canary-v1
  model_pattern: gpt-5.4
  target_model: gpt-5.4-mini
  eligible_categories:
    - chat
    - short-completion
    - tool-light
  excluded_categories:
    - tool-result
    - tool-heavy
    - code-gen
    - long-context
  allow_tools: true
  allow_stream: false
  min_text_chars: 0
  max_text_chars: 16000
  min_input_tokens_est: 0
  max_input_tokens_est: 4000
  canary_fraction: 0.15
  holdout_fraction: 0.10
  salt: agentflow-openai-routing-canary-v1
  cohort_unit: request_features_sequence
  safety_stop:
    enabled: true
    window_hours: 24
    min_samples: 20
    min_holdout_samples: 10
    max_error_rate: 0.03
    max_retry_rate: 0.10
    max_fallback_rate: 0.10
    max_latency_regression_ratio: 1.50
    limit: 1000

rules:

- id: promoted-openai-gpt54-tool-light-mini
  enabled: false
  disabled_reason: semantic-quality-regression-observed
  policy_source: local-promoted
  conditions:
    provider: openai
    source_surface: openai_responses
    endpoint: responses
    model_pattern: "gpt-5.4"
    category: "tool-light"
    has_tools: true
    stream: false
    max_text_chars: 16000
    max_input_tokens_est: 4000
  action:
    route_to: "gpt-5.4-mini"
    reason: "promoted OpenAI gpt-5.4 tool-light routing rule"
  metadata:
    schema: agentflow.openai_routing_promotion_rule_metadata.v1
    source: openai_routing_promotion_decision
    promoted_from_canary: true
    promotion_source_policy_id: local-openai-routing-canary-v1
    source_evidence_schema: agentflow.openai_routing_promotion_decision_report.v1
    target_local_policy_section: routing.rules
    target_local_rule_file: routing_rules.yaml
    promotion_decision:
      decision: promote
      reason: promotion-ready
      next_action: draft-openai-routing-rule
      matched_count: 404
      applied_count: 23
      holdout_count: 19
      safety_stop_count: 0
      error_count: 0
      retry_count: 0
      fallback_count: 0
      savings_per_1000_calls_usd: 4.375
      projected_savings_usd: 1.7675
    rollback_metadata:
      rollback_action_type: disable_openai_routing_rule
      disabled_patch:
        id: promoted-openai-gpt54-tool-light-mini
        enabled: false
        disabled_reason: operator-requested
      rollback_reason_codes:
        - operator-requested
        - safety-stop-observed
        - error-observed
        - fallback-observed
        - retry-observed
        - stale-evidence
    privacy:
      metadata_only: true
      aggregate_only: true
      content_free: true
      identifiers_included: false
      provider_payloads_included: false
      local_paths_included: false
      cache_identifiers_included: false
      individual_candidates_included: false
      provider_calls_made: false
      managed_server_calls_made: false

- conditions:
    model_pattern: "opus"
    text_chars_lt: 24000
    has_tools: false
  action:
    route_to: sonnet
    reason: "non-tool Opus request under threshold routed to Sonnet"

- conditions:
    model_pattern: "sonnet"
    category: "tool-result"
  action:
    route_to: haiku
    reason: "tool-result processing turn routed to Haiku"

- conditions:
    model_pattern: "sonnet"
    category: "tool-light"
  action:
    route_to: haiku
    reason: "tool-light Sonnet request routed to Haiku"

- conditions:
    model_pattern: "sonnet"
    text_chars_lt: 10000
    has_tools: false
  action:
    route_to: haiku
    reason: "small non-tool Sonnet request routed to Haiku"

- conditions:
    model_pattern: "sonnet"
    text_chars_gte: 10000
    text_chars_lte: 30000
    has_tools: false
    env_flag: "AGENTFLOW_ROUTE_MIDSIZE"
    category_not_in:
      - code-gen
      - thinking
  action:
    route_to: haiku
    reason: "midsize non-tool Sonnet request routed to Haiku"

- conditions:
    model_pattern: "opus"
    text_chars_lt: 8000
    has_tools: true
  action:
    route_to: sonnet
    reason: "small tool request Opus routed to Sonnet; disable with AGENTFLOW_ROUTING=0 if unsafe"
