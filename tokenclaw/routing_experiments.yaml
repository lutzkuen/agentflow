# TokenClaw local routing-experiment guardrails + deterministic fallback.
# Copy to ~/.tokenclaw/routing_experiments.yaml (or set TOKENCLAW_ROUTING_EXPERIMENTS)
# to override.
#
# Phase 3 of the server-issued experiment-policy migration (#932/#935): this
# file no longer carries a candidate matrix. The standing candidates, sample
# fractions, and per-candidate budgets are issued by tokenclaw_server as a
# signed, TTL'd tokenclaw.routing_experiment_policy.v1 bundle and hot-applied
# by the proxy. Decision precedence: server plan -> local guardrail -> off.
# What this file keeps:
#   - guardrails: kill_switch, blocklist, preferred_pathways, and the control
#     caps (sample_rate / daily_budget_usd / text-char bounds) that the server
#     policy can never exceed — local safety always wins;
#   - a tiny deterministic fallback (fallback_routes) so the proxy stays
#     useful with the server off. No local-minted matrix (backed-or-off).
#
# Response bodies are not stored unless store_response_bodies is explicitly enabled.

profile_id: guardrails-plus-deterministic-fallback-v2
mode: shadow_candidate_pass_through
enabled: true
kill_switch: false
sample_rate: 0.10
daily_budget_usd: 100.0
min_text_chars: 0
max_text_chars: 0
providers:
  - anthropic
  - openai
source_surfaces:
  - anthropic_messages
  - openai_responses
  - openai_chat
streaming_shadow_source_surfaces:
  - anthropic_messages

# Thin-client routing policy. Managed servers discover and mint new pathways;
# the local client keeps only guardrails, explicit preferences, and a small
# deterministic fallback so it remains useful with no server configured.
blocklist: []
preferred_pathways: []
fallback_routes:
  - requested_model: claude-opus-4-8
    routed_model: claude-sonnet-4-6
  - requested_model: claude-opus-4-5
    routed_model: claude-sonnet-4-6
  - requested_model: claude-sonnet-4-6
    routed_model: claude-haiku-4-5-20251001
  # OpenAI ladder (2026-07): 5.6 tiers step down sol -> terra -> luna with
  # gpt-5-mini as the deliberate rock bottom (no mini -> nano rung).
  # Deprecated 5.5 (price-twin of sol) and 5.4 (price-twin of terra) jump
  # straight to the cheaper current-generation sibling. Bare "gpt-5.6"
  # serves Sol upstream, hence the terra rung.
  - requested_model: gpt-5.6-sol
    routed_model: gpt-5.6-terra
  - requested_model: gpt-5.6-terra
    routed_model: gpt-5.6-luna
  - requested_model: gpt-5.6-luna
    routed_model: gpt-5-mini
  - requested_model: gpt-5.6
    routed_model: gpt-5.6-terra
  - requested_model: gpt-5.5
    routed_model: gpt-5.6-terra
  - requested_model: gpt-5.4
    routed_model: gpt-5.6-luna
  - requested_model: gpt-5.3-codex
    routed_model: gpt-5-codex
  - requested_model: gpt-5-codex
    routed_model: gpt-5-mini
  - requested_model: gpt-5.3
    routed_model: gpt-5-mini
# Phase 3 (#935): the local file is guardrails + a tiny deterministic fallback.
# The standing candidate matrix, sample fractions, and per-candidate budgets are
# server-issued (tokenclaw.routing_experiment_policy.v1) when the managed feed is
# backed; without backing there is no local-minted matrix (backed-or-off). The
# controls above are local caps the server can never exceed.
model_pairs: []
routing_candidates: []
workflow_phases: []
categories:
  - chat
  - short-completion
  - tool-light
  - tool-result
  - tool-heavy
  - codex-turn
eligibility_overrides: []
similarity_threshold: 0.86
min_samples_for_confidence: 20
store_response_bodies: false
