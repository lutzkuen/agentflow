[project]
name = "agentflow-claude-proxy"
version = "0.1.0"
description = "Local Anthropic-compatible proxy for Claude Code/CLI with caching, crunching, routing, and logging."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
agentflow-claude-proxy = "agentflow_proxy.server:main"
agentflow-dashboard = "agentflow_proxy.dashboard:main"

[tool.setuptools]
packages = ["agentflow_proxy"]
