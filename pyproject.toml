[project]
name = "agentflow-proxy"
version = "0.1.0"
description = "Local provider-specific proxy for Claude and Codex with caching, crunching, routing, and logging."
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "websockets>=15.0",
  "zstandard>=0.23",
  "psycopg[binary,pool]>=3.2",
]

[project.scripts]
agentflow = "agentflow_proxy.cli:agentflow_main"
