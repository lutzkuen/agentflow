[project]
name = "agentflow-proxy"
version = "0.1.0"
description = "Local provider-specific proxy for Claude and Codex with caching, crunching, routing, and logging."
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "websockets>=15.0",
  "zstandard>=0.23",
  "psycopg[binary,pool]>=3.2",
]

[project.scripts]
agentflow-proxy = "agentflow_proxy.cli:proxy_main"
agentflow-claude-proxy = "agentflow_proxy.cli:proxy_main"
agentflow-policy-reload = "agentflow_proxy.cli:policy_reload_main"
agentflow-policy-export = "agentflow_proxy.cli:policy_export_main"
agentflow-policy-validate = "agentflow_proxy.cli:policy_validate_main"
agentflow-policy-diff = "agentflow_proxy.cli:policy_diff_main"
agentflow-policy-review = "agentflow_proxy.cli:policy_review_main"
agentflow-policy-fetch-review = "agentflow_proxy.cli:policy_fetch_review_main"
agentflow-policy-apply = "agentflow_proxy.cli:policy_apply_main"
agentflow-policy-rollback = "agentflow_proxy.cli:policy_rollback_main"
agentflow-codex-app-proxy = "agentflow_proxy.codex_app_proxy:main"
agentflow-codex-app-client = "agentflow_proxy.codex_app_client:main"
agentflow-codex-diagnose = "agentflow_proxy.cli:codex_diagnose_main"
agentflow-dashboard = "agentflow_proxy.dashboard:main"

[tool.setuptools]
packages = ["agentflow_proxy"]
