[project]
name = "tokenclaw"
version = "0.1.0"
description = "Local proxy for token savings on LLM traffic: crunching, routing, caching, and telemetry."
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "websockets>=15.0",
  "zstandard>=0.23",
  "psycopg[binary,pool]>=3.2",
]

[project.urls]
Homepage = "https://github.com/lutzkuen/tokenclaw"
Repository = "https://github.com/lutzkuen/tokenclaw"
Issues = "https://github.com/lutzkuen/tokenclaw/issues"

