[project]
name = "tokenclaw"
version = "0.1.2"
description = "Local proxy for token savings on LLM traffic: crunching, routing, caching, and telemetry."
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
managed = [
  "psycopg[binary,pool]>=3.2",
]
compression = [
  "zstandard>=0.23",
]
openai-realtime = [
  "websockets>=15.0",
]
dev = [
  "build>=1.2",
]
all = [
  "psycopg[binary,pool]>=3.2",
  "zstandard>=0.23",
  "websockets>=15.0",
]

[project.urls]
Homepage = "https://github.com/lutzkuen/tokenclaw"
Repository = "https://github.com/lutzkuen/tokenclaw"
Issues = "https://github.com/lutzkuen/tokenclaw/issues"

[project.scripts]
tokenclaw = "tokenclaw.cli:tokenclaw_main"

[tool.setuptools]
packages = ["tokenclaw", "tokenclaw.cli_commands", "tokenclaw.optimization", "tokenclaw.stats"]

[tool.setuptools.package-data]
tokenclaw = ["*.yaml"]
