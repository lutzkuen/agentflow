[project]
name = "agentflow-proxy"
version = "0.1.0"
description = "Local provider-specific proxy for Claude and Codex with caching, crunching, routing, and logging."
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "websockets>=15.0",
  "zstandard>=0.23",
  "psycopg[binary,pool]>=3.2",
]

[project.scripts]
agentflow-proxy = "agentflow_proxy.cli:proxy_main"
agentflow-claude-proxy = "agentflow_proxy.cli:proxy_main"
agentflow-policy-reload = "agentflow_proxy.cli:policy_reload_main"
agentflow-policy-export = "agentflow_proxy.cli:policy_export_main"
agentflow-policy-validate = "agentflow_proxy.cli:policy_validate_main"
agentflow-policy-diff = "agentflow_proxy.cli:policy_diff_main"
agentflow-policy-review = "agentflow_proxy.cli:policy_review_main"
agentflow-policy-fetch-review = "agentflow_proxy.cli:policy_fetch_review_main"
agentflow-policy-apply = "agentflow_proxy.cli:policy_apply_main"
agentflow-policy-rollback = "agentflow_proxy.cli:policy_rollback_main"
agentflow-managed-rollout-actions-review = "agentflow_proxy.cli:managed_rollout_actions_review_main"
agentflow-managed-rollout-actions-apply = "agentflow_proxy.cli:managed_rollout_actions_apply_main"
agentflow-managed-rollout-actions-dry-run = "agentflow_proxy.cli:managed_rollout_actions_dry_run_main"
agentflow-managed-rollout-actions-impact = "agentflow_proxy.cli:managed_rollout_actions_impact_main"
agentflow-old-context-summary-dry-run = "agentflow_proxy.cli:old_context_summary_dry_run_main"
agentflow-old-context-summary-impact = "agentflow_proxy.cli:old_context_summary_impact_main"
agentflow-old-context-summary-rollout-actions-review = "agentflow_proxy.cli:old_context_summary_rollout_actions_review_main"
agentflow-old-context-summary-rollout-actions-apply = "agentflow_proxy.cli:old_context_summary_rollout_actions_apply_main"
agentflow-old-context-summary-rollout-actions-dry-run = "agentflow_proxy.cli:old_context_summary_rollout_actions_dry_run_main"
agentflow-old-context-summary-rollout-actions-impact = "agentflow_proxy.cli:old_context_summary_rollout_actions_impact_main"
agentflow-codex-app-proxy = "agentflow_proxy.codex_app_proxy:main"
agentflow-codex-app-client = "agentflow_proxy.codex_app_client:main"
agentflow-codex-diagnose = "agentflow_proxy.cli:codex_diagnose_main"
agentflow-openai-scoreboard = "agentflow_proxy.cli:openai_scoreboard_main"
agentflow-phase-routing-report = "agentflow_proxy.cli:phase_routing_report_main"
agentflow-cache-replayability-report = "agentflow_proxy.cli:cache_replayability_report_main"
agentflow-managed-feedback-status = "agentflow_proxy.cli:managed_feedback_status_main"
agentflow-managed-feedback-flush = "agentflow_proxy.cli:managed_feedback_flush_main"
agentflow-managed-pattern-rollups = "agentflow_proxy.cli:managed_pattern_rollups_main"
agentflow-dashboard = "agentflow_proxy.dashboard:main"

[tool.setuptools]
packages = ["agentflow_proxy", "agentflow_proxy.optimization"]

[tool.setuptools.package-data]
agentflow_proxy = ["*.yaml"]
