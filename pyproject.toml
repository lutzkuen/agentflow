[project]
name = "tokenclaw"
version = "0.2.2"
description = "Token savings for LLM traffic: crunching + local cache as a library, or a local proxy with routing and telemetry."
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
# Base install is the server-free library (crunching + local cache). PyYAML is the
# only hard runtime dependency; the proxy's web stack lives in the [server] extra.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed to run the proxy server / CLI (`python -m tokenclaw.server`,
# `tokenclaw run ...`). Library-only users (crunching + local cache) do not need these.
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]
managed = [
  "psycopg[binary,pool]>=3.2",
]
compression = [
  "zstandard>=0.23",
]
openai-realtime = [
  "websockets>=15.0",
]
dev = [
  "build>=1.2",
]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "psycopg[binary,pool]>=3.2",
  "zstandard>=0.23",
  "websockets>=15.0",
]

[project.urls]
Homepage = "https://github.com/lutzkuen/tokenclaw"
Repository = "https://github.com/lutzkuen/tokenclaw"
Issues = "https://github.com/lutzkuen/tokenclaw/issues"

[project.scripts]
tokenclaw = "tokenclaw.cli:tokenclaw_main"

[tool.setuptools]
packages = ["tokenclaw", "tokenclaw.cli_commands", "tokenclaw.optimization", "tokenclaw.stats"]

[tool.setuptools.package-data]
tokenclaw = ["*.yaml"]
